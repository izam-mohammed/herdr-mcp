[advisories]
version = 2
yanked = "deny"
# chrono is unmaintained, not vulnerable, and comes in through rmcp and
# schemars with no replacement offered by either (checked 20/11/2026).
ignore = ["RUSTSEC-2026-0543"]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
