<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">herdr-mcp</title>
  <desc id="d">A red tie, promoted to manage three AI agent panes: one working (allegedly), one blocked (on you), one done (it says).</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1f2430"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#0d1016"/>
  <rect width="1200" height="400" rx="24" fill="url(#dots)"/>
  <circle cx="735" cy="205" r="170" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <!-- left: the pitch -->
    <text x="64" y="92" font-size="17" fill="#6b7280">$ herdr-mcp --role=middle-management</text>
    <text x="62" y="168" font-size="72" font-weight="700" fill="#f5f5f4">herdr-mcp</text>
    <text x="64" y="218" font-size="21" fill="#d1d5db">Your AI agents finally have a manager.</text>
    <text x="64" y="252" font-size="21" fill="#8b93a1">It's also an AI. Obviously.</text>

    <g font-size="15">
      <rect x="64" y="300" width="70" height="34" rx="17" fill="#151922" stroke="#3f4757"/>
      <text x="99" y="322" text-anchor="middle" fill="#cbd5e1">MCP</text>
      <rect x="146" y="300" width="130" height="34" rx="17" fill="#151922" stroke="#3f4757"/>
      <text x="211" y="322" text-anchor="middle" fill="#cbd5e1">no standups</text>
    </g>

    <!-- the org chart -->
    <g stroke="#4b5563" stroke-width="2" stroke-dasharray="6 6" fill="none">
      <path d="M770 205 H800 V117 H838"/>
      <path d="M770 205 H838"/>
      <path d="M800 205 V293 H838"/>
    </g>

    <!-- speech bubble -->
    <rect x="600" y="58" width="236" height="46" rx="12" fill="#f5f5f4"/>
    <path d="M700 104 L716 104 L704 120 Z" fill="#f5f5f4"/>
    <text x="718" y="87" font-size="17" text-anchor="middle" fill="#111827">per my last prompt…</text>

    <!-- the manager: just a tie -->
    <g transform="translate(732 195) scale(1.35) translate(-732 -195)">
    <polygon points="722,146 742,146 738,160 726,160" fill="#dc2626"/>
    <polygon points="726,160 738,160 746,228 732,244 718,228" fill="#ef4444"/>
    <path d="M722 182 L742 172 M720 206 L744 194" stroke="#b91c1c" stroke-width="3"/>
    </g>
    <text x="732" y="318" font-size="14" text-anchor="middle" fill="#6b7280">promoted to management</text>

    <!-- the reports -->
    <g font-size="15">
      <rect x="838" y="82" width="300" height="70" rx="10" fill="#151922" stroke="#262c38"/>
      <circle cx="856" cy="98" r="4" fill="#3a4252"/><circle cx="870" cy="98" r="4" fill="#3a4252"/><circle cx="884" cy="98" r="4" fill="#3a4252"/>
      <text x="856" y="134" fill="#e5e7eb">claude · w1:p1</text>
      <rect x="1024" y="114" width="96" height="26" rx="13" fill="#14532d"/>
      <text x="1072" y="132" text-anchor="middle" fill="#86efac">working</text>
      <text x="1120" y="100" text-anchor="end" font-size="13" fill="#6b7280">(allegedly)</text>

      <rect x="838" y="170" width="300" height="70" rx="10" fill="#151922" stroke="#262c38"/>
      <circle cx="856" cy="186" r="4" fill="#3a4252"/><circle cx="870" cy="186" r="4" fill="#3a4252"/><circle cx="884" cy="186" r="4" fill="#3a4252"/>
      <text x="856" y="222" fill="#e5e7eb">codex · w2:p1</text>
      <rect x="1024" y="202" width="96" height="26" rx="13" fill="#713f12"/>
      <text x="1072" y="220" text-anchor="middle" fill="#fcd34d">blocked</text>
      <text x="1120" y="188" text-anchor="end" font-size="13" fill="#6b7280">(on you)</text>

      <rect x="838" y="258" width="300" height="70" rx="10" fill="#151922" stroke="#262c38"/>
      <circle cx="856" cy="274" r="4" fill="#3a4252"/><circle cx="870" cy="274" r="4" fill="#3a4252"/><circle cx="884" cy="274" r="4" fill="#3a4252"/>
      <text x="856" y="310" fill="#e5e7eb">claude · w3:p2</text>
      <rect x="1024" y="290" width="96" height="26" rx="13" fill="#1e3a8a"/>
      <text x="1072" y="308" text-anchor="middle" fill="#93c5fd">done</text>
      <text x="1120" y="276" text-anchor="end" font-size="13" fill="#6b7280">(it says)</text>
    </g>
  </g>
</svg>
