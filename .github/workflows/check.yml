name: check
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: tools
        run: |
          cargo install --locked cargo-deny
          sudo apt-get update && sudo apt-get install -y shellcheck
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: check
        run: sh scripts/check.sh
