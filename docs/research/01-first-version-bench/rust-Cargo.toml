[package]
name = "bench"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.6", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
