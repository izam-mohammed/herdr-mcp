[package]
name = "herdr-mcp"
version = "0.1.0"
edition = "2024"
description = "An MCP server that lets Claude Code and other MCP clients see and control a herdr session"
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "3.11", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unused_async_trait_impl = "allow" # rmcp macros emit async trait fns

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
